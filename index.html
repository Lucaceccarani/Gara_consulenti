<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Super Immobiliare Dashboard</title>

<style>

html,body{

margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;

}

iframe{

width:100%;
height:100%;
border:0;

}

</style>


</head>


<body>


<iframe id="schermo" src="mensile.html"></iframe>



<script>


let mensile = true;


setInterval(()=>{


const frame=document.getElementById("schermo");


if(mensile){

frame.src="annuale.html";

}else{

frame.src="mensile.html";

}


mensile=!mensile;



},60000);



</script>


</body>

</html>
