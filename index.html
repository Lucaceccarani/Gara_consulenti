<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>Super Immobiliare Dashboard</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

/* Contenitore degli iframe */
#contenitore {
    position: relative;
    width: 100%;
    height: 100%;
}

/* I due schermi sono sovrapposti */
.schermo {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;

    opacity: 0;

    transition: opacity 1.5s ease-in-out;
}

/* Schermo visibile */
.schermo.attivo {
    opacity: 1;
}

</style>

</head>

<body>

<div id="contenitore">

<iframe id="schermo1" class="schermo attivo" src="mensile.html"></iframe>

<iframe id="schermo2" class="schermo" src=""></iframe>

</div>

<script>

const pagine = [
    "mensile.html",
    "podio_mensile.html",
    "annuale.html",
    "podio_annuale.html"
];

let indice = 0;

let schermoAttivo = document.getElementById("schermo1");
let schermoInattivo = document.getElementById("schermo2");


setInterval(() => {

    // Calcola la pagina successiva
    indice++;

    if (indice >= pagine.length) {
        indice = 0;
    }

    // Carica la pagina successiva nello schermo nascosto
    schermoInattivo.src = pagine[indice];


    // Quando la pagina è completamente caricata
    schermoInattivo.onload = () => {

        // Dissolvenza in entrata
        schermoInattivo.classList.add("attivo");

        // Dissolvenza in uscita
        schermoAttivo.classList.remove("attivo");


        // Scambia i due iframe
        const temp = schermoAttivo;

        schermoAttivo = schermoInattivo;
        schermoInattivo = temp;

    };

}, 15000);

</script>

</body>

</html>
