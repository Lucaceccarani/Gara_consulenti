<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Super Immobiliare - Segna attività</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="segna.css">

</head>

<body>

<header class="testata">

    <!-- Per mostrare il logo basta salvare il file come "logo.png" nella cartella del sito.
         Finché non c'è, compare il nome scritto. -->
    <img class="logo-img" src="logo.png" alt="Super Immobiliare"
         onerror="this.remove(); document.getElementById('logo-testo').hidden = false;">
    <div id="logo-testo" class="logo-testo" hidden>SUPER IMMOBILIARE</div>

</header>

<main>

    <div class="intro">
        <h1>Segna attività</h1>
        <p>Scegli il tuo nome, inserisci il PIN e tocca l'attività da registrare.</p>
    </div>

    <section class="riquadro">

        <label for="consulente">Chi sei?</label>
        <select id="consulente">
            <option value="">Caricamento…</option>
        </select>

        <label for="pin">Il tuo PIN</label>
        <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN personale">

        <label class="ricorda">
            <input id="ricorda" type="checkbox" checked>
            Ricorda su questo dispositivo
        </label>

    </section>

    <section class="bottoni" aria-label="Attività">

        <button class="tipo verde" data-tipo="punti">
            <span class="icona">€</span>
            <span class="nome">Punti</span>
        </button>

        <button class="tipo arancio" data-tipo="idv">
            <span class="icona">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
            </span>
            <span class="nome">Incarico di Vendita</span>
        </button>

        <button class="tipo giallo" data-tipo="ida">
            <span class="icona">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>
            </span>
            <span class="nome">Incarico di Acquisto</span>
        </button>

        <button class="tipo blu" data-tipo="ribassi">
            <span class="icona">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 17l-8.5-8.5-5 5L2 7"/><path d="M16 17h6v-6"/></svg>
            </span>
            <span class="nome">Ribasso</span>
        </button>

    </section>

    <div id="messaggio" role="status"></div>

    <button id="annulla" class="annulla" hidden>↩️ Annulla ultima segnalazione</button>

</main>

<footer class="piede">Super Immobiliare · Gara Consulenti</footer>

<!-- Finestra di conferma -->
<div id="conferma" class="overlay" hidden>
    <div class="finestra">
        <h2 id="conferma-titolo"></h2>

        <label for="cliente">Nome del cliente</label>
        <input id="cliente" type="text" maxlength="100" autocomplete="off" placeholder="es. Mario Rossi">

        <div id="campo-importo" hidden>
            <label for="importo">Importo (€)</label>
            <input id="importo" type="number" inputmode="decimal" min="0" step="any" placeholder="es. 4500">
        </div>

        <div id="campo-quantita" hidden>
            <label>Quantità</label>
            <div class="scelta">
                <button type="button" data-q="1" class="attiva">1</button>
                <button type="button" data-q="0.5">0,5</button>
            </div>
        </div>

        <div class="azioni">
            <button id="conferma-no" class="secondario">Indietro</button>
            <button id="conferma-si" class="primario">Conferma</button>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script src="segna.js"></script>

</body>

</html>
